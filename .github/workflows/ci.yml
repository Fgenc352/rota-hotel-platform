name: Test case study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -Ptest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node ../scripts/validate-artifacts.mjs
      - run: node --test ../pms-mock/*.test.mjs
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        infrastructure: [direct, kafka-redis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and start the complete case study
        env:
          MODE: ${{ matrix.infrastructure }}
        run: |
          if [ "$MODE" = "kafka-redis" ]; then
            docker compose up --build -d --wait --wait-timeout 180
          else
            MESSAGING_TRANSPORT=direct AVAILABILITY_CACHE_PROVIDER=memory docker compose up --build -d --wait --wait-timeout 180
          fi
      - run: node scripts/docker-smoke.mjs
      - name: Install browser test dependencies
        if: matrix.infrastructure == 'direct'
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Install Chromium
        if: matrix.infrastructure == 'direct'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test the production frontend served by Nginx
        if: matrix.infrastructure == 'direct'
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npm run e2e
        working-directory: frontend
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > containers.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: containers-${{ matrix.infrastructure }}
          path: |
            containers.log
            frontend/playwright-report
            frontend/test-results
      - run: docker compose down
        if: always()
