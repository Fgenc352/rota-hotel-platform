server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /api/public/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # CRM and staff authentication are served by the main frontend only.
    location ^~ /api/ { return 404; }

    location ~ ^/(?:widget(?:-(?:premium|signature|atelier|maison|quiet))?|room-gallery)$ {
        try_files /index.html =404;
    }

    location ~* \.(js|css|webp|png|jpg|jpeg|svg|woff2?|ico|json)$ {
        try_files $uri =404;
    }

    location / { return 404; }
}
