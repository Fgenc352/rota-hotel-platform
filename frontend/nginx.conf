server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Serve embedded booking pages and loaders through the independent widget service.
    # Keeping the public URL same-origin preserves iframe messaging and local dev links.
    location ~ ^/(?:widget(?:-(?:premium|signature|atelier|maison|quiet|gallery))?(?:\.js)?|room-gallery)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $widget_backend widget:8080;
        proxy_pass http://$widget_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|webp|png|jpg|jpeg|svg|woff2?|ico|json)$ {
        try_files $uri =404;
    }

    # Deep links and embedded widget routes are handled by Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
